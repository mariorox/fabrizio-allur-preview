services:
  - type: web
    name: fabrizio-allur
    env: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: DATA_DIR
        value: /tmp/fabrizio-data
      - key: AI_PROVIDER
        value: gemini
      - key: AI_API_KEY
        sync: false
